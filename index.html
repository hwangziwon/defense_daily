button{font-family:inherit} .course-card .sources{margin-top:20px}.course-card p+p{margin-top:15px}.habit-card>button{margin-top:16px}.notebook select{max-width:100%}</style></head><body><div id="app"></div><dialog id="lesson" class="lesson-dialog" aria-labelledby="lesson-title"></dialog><noscript>이 학습 도구를 사용하려면 JavaScript를 켜 주세요.</noscript><script type="application/json" id="study-data">{"lessons":[{"id":"industry","track":0,"title":"방산은 무엇이 다른가","subtitle":"방위산업, 방위사업, 방위력개선사업을 구분해요.","terms":["방위산업","방위사업","방위력개선사업"],"sections":[{"title":"같은 듯 다른 세 단어","text":"방산은 방위산업의 줄임말입니다. 방위산업은 국방에 쓰이는 물자·체계의 연구개발, 생산과 정비 등에 관련된 산업입니다. 방위사업은 전력 개선, 산업 육성, 군수품 조달 등을 아우르는 정부 활동으로 이해하면 좋습니다."},{"title":"고객과 시간의 차이","text":"일반 소비재와 달리 군과 정부가 핵심 고객입니다. 필요한 능력을 먼저 정하고 예산과 절차에 따라 획득합니다. 개발 기간이 길고, 장비를 납품한 뒤에도 정비·교육·성능개량이 이어집니다."},{"title":"면접에서는 이렇게 연결","text":"좋은 기술만으로는 사업이 완성되지 않습니다. 군의 임무, 성능 요구, 일정, 비용, 신뢰성, 보안, 장기간의 운용 지원을 함께 충족해야 한다고 설명해 보세요."}],"takeaway":"방산은 군이 필요한 능력을 긴 생애주기에 걸쳐 제공하는 산업이다.","prompt":"방위산업이 일반 제조업과 다른 점을 두 가지 설명해 주세요.","guide":["군·정부 중심의 수요","긴 획득 및 운용 기간","신뢰성·일정·후속지원과 자신의 경험 연결"],"sources":[{"title":"방위산업 개론","url":"/materials/industry-overview.pdf#page=5","pages":"5–9"},{"title":"방위사업청 · 사업관리","url":"https://dapa.go.kr/dapa/page/selectPage.do?menuSeq=3209&pageSeq=3195"}],"questions":[{"prompt":"방산과 방위산업의 관계는?","options":["서로 다른 산업이다","방산은 방위산업의 줄임말이다","방산은 수출만 의미한다"],"correct":1,"explanation":"방산은 방위산업을 줄여 부르는 말입니다."},{"prompt":"방산 사업을 이해하는 관점으로 가장 적절한 것은?","options":["판매 가격만 낮추면 된다","납품 이후는 고려하지 않는다","성능·일정·비용·운용 지원을 함께 본다"],"correct":2,"explanation":"무기체계는 장기간 운용되므로 생애주기 전체를 봐야 합니다."}]},{"id":"organizations","track":0,"title":"군과 기관의 역할 지도","subtitle":"합참, 방사청, ADD를 헷갈리지 않도록.","terms":["합참","방위사업청","ADD","기품원"],"sections":[{"title":"필요를 정하는 쪽","text":"각 군은 임무 수행에 필요한 능력과 전력을 제기하고, 합참은 합동성 등을 고려해 무기체계 소요 결정에 중심 역할을 합니다. 국방부는 국방정책과 계획·자원을 총괄합니다."},{"title":"사업을 실행하는 쪽","text":"방위사업청은 획득 사업을 관리하며 IPT(통합사업관리팀)가 사업 추진의 중심이 됩니다. 국방과학연구소(ADD)는 국방 연구개발, 국방기술품질원은 품질보증 등의 역할을 맡습니다."},{"title":"기관과 업체는 협력 관계","text":"업체는 계약과 사업 구조에 따라 개발·생산·통합·지원에 참여합니다. 하나의 무기체계에는 여러 전문업체가 참여하므로, 요구사항과 인터페이스를 맞추는 협업이 중요합니다."}],"takeaway":"소요·획득·연구개발·품질보증의 역할을 구분하면 사업이 보인다.","prompt":"무기체계 개발에서 합참, 방사청, 업체는 각각 어떤 일을 하나요?","guide":["소요 결정","획득 사업 관리","개발·생산·통합 책임"],"sources":[{"title":"국방과 방위산업","url":"/materials/defense-foundations.pdf#page=8","pages":"8–11"},{"title":"국방과 방위산업","url":"/materials/defense-foundations.pdf#page=37","pages":"37–40"},{"title":"방위사업청 · 사업관리","url":"https://dapa.go.kr/dapa/page/selectPage.do?menuSeq=3209&pageSeq=3195"}],"questions":[{"prompt":"획득 사업을 관리하는 중심 기관은?","options":["방위사업청","한국은행","개별 부품업체만"],"correct":0,"explanation":"방위사업청은 무기체계 획득 사업을 추진·관리합니다."},{"prompt":"IPT는 무엇을 의미하나요?","options":["국제 가격 협정","통합사업관리팀","조종사 훈련 과정"],"correct":1,"explanation":"IPT는 여러 기능을 통합해 사업을 관리하는 조직입니다."}]},{"id":"planning","track":0,"title":"소요가 예산이 되기까지","subtitle":"PPBEE로 국방기획의 흐름을 읽어요.","terms":["PPBEE","소요","국방중기계획"],"sections":[{"title":"소요는 필요한 능력","text":"소요는 특정 임무를 수행하기 위해 필요한 전력·자원의 요구입니다. 위협 변화, 현재 장비의 한계, 운영유지비, 새로운 기술 등이 소요의 출발점이 됩니다."},{"title":"다섯 단계의 연결","text":"국방기획관리체계 PPBEE는 기획(Planning), 계획(Programming), 예산(Budgeting), 집행(Execution), 평가(Evaluation)의 연결입니다. 필요한 능력을 정하고, 자원 계획과 예산에 반영해 실행하고 평가합니다."},{"title":"소요 결정은 계약이 아니다","text":"소요가 있다고 바로 업체 매출이 생기지 않습니다. 계획·예산과 획득방안, 업체 선정, 계약 등이 연결돼야 합니다. 사업 기사를 볼 때 지금 어느 단계인지 먼저 확인하세요."}],"takeaway":"필요성의 승인, 예산의 확보, 계약의 체결은 서로 다른 단계다.","prompt":"소요가 결정되면 바로 방산업체가 수주하는 것인가요?","guide":["소요와 예산의 구분","획득방안과 업체 선정","단계별 불확실성"],"sources":[{"title":"국방기획과 산업 육성","url":"/materials/planning-policy.pdf#page=3","pages":"3–8"}],"questions":[{"prompt":"PPBEE에서 예산 다음 단계는?","options":["집행","기획","수출허가"],"correct":0,"explanation":"기획→계획→예산→집행→평가가 기본 흐름입니다."},{"prompt":"소요 결정에 대한 올바른 설명은?","options":["특정 업체의 매출 확정","필요한 능력에 대한 결정","양산 완료"],"correct":1,"explanation":"소요 결정과 예산·계약은 구분해서 이해해야 합니다."}]},{"id":"acquisition","track":0,"title":"수주에서 전력화까지","subtitle":"복잡한 획득 절차를 하나의 흐름으로.","terms":["선행연구","탐색개발","체계개발","DT·OT"],"sections":[{"title":"획득 방법부터 고른다","text":"선행연구는 기술 수준, 개발 가능성, 비용과 시기 등을 조사해 획득방안 결정을 지원합니다. 사업추진기본전략에서 연구개발 또는 구매 등 추진 방법과 위험관리 방안을 구체화합니다."},{"title":"업체는 어떻게 수주할까","text":"사업 방식에 따라 제안요청, 제안서 제출·평가, 협상과 계약 등의 과정을 거칩니다. 모든 사업이 같은 경쟁 절차를 쓰는 것은 아닙니다. 요구 성능, 일정, 비용, 개발 역량을 근거로 제안해야 합니다."},{"title":"개발과 시험을 거쳐 운용으로","text":"일반적인 연구개발은 탐색개발로 핵심기술과 기본설계를 검토하고 체계개발에서 상세설계·시제·시험평가 등을 수행합니다. 이후 양산·배치와 운영유지가 이어집니다. 구매·신속획득은 별도 경로이며 단계 통합·생략도 있습니다."}],"takeaway":"획득 절차는 군의 필요를 검증된 운용 능력으로 바꾸는 과정이다.","prompt":"방산 사업의 수주부터 전력화까지 흐름을 설명해 주세요.","guide":["획득방안과 제안·계약","개발·시험평가","양산·운용 및 방식별 차이"],"sources":[{"title":"획득 절차와 수출 제도","url":"/materials/acquisition-export.pdf#page=5","pages":"5–23"},{"title":"방위사업청 · 사업관리","url":"https://dapa.go.kr/dapa/page/selectPage.do?menuSeq=3209&pageSeq=3195"}],"questions":[{"prompt":"선행연구의 핵심 목적은?","options":["획득방안 결정 지원","양산품 전량 출고","광고 문구 결정"],"correct":0,"explanation":"개발 가능성·기술 수준·경제성 등을 분석합니다."},{"prompt":"모든 무기체계가 반드시 같은 개발 단계를 거치나요?","options":["그렇다","아니다. 구매·신속획득 등 경로가 다르다","시험평가는 항상 생략한다"],"correct":1,"explanation":"추진 방식에 따라 절차가 달라지며 단계 통합·생략도 가능합니다."}]},{"id":"requirements","track":0,"title":"요구사항과 검증의 언어","subtitle":"ROC, 시험평가, 생애주기 비용.","terms":["ROC","DT","OT","운영유지"],"sections":[{"title":"ROC는 임무에서 출발","text":"작전운용성능(ROC)은 운용개념을 충족하기 위한 성능 수준과 능력을 나타냅니다. 단순한 부품 사양이 아니라 합동성·상호운용성 등 체계 관점도 포함합니다."},{"title":"기술적으로 되는가, 운용에 맞는가","text":"개발시험평가(DT)는 요구 성능의 기술적 달성 여부를, 운용시험평가(OT)는 운용 환경에서의 적합성 등을 살핍니다. 소프트웨어도 요구사항과 시험 근거의 추적이 중요합니다."},{"title":"납품 뒤에도 이어지는 일","text":"정비성, 가용성, 교육과 부품 단종 대응은 장기간 운용의 핵심입니다. 성능뿐 아니라 개발·획득·운영유지 비용을 함께 봐야 합니다."}],"takeaway":"요구사항을 시험 가능한 기준으로 연결하는 것이 체계 개발의 기본이다.","prompt":"성능이 좋은 장비라도 군에 적합하지 않을 수 있는 이유는 무엇인가요?","guide":["운용 환경과 임무","연동·정비·신뢰성","시험으로 입증하는 태도"],"sources":[{"title":"획득 절차와 수출 제도","url":"/materials/acquisition-export.pdf#page=17","pages":"17–23"},{"title":"국방과 방위산업","url":"/materials/defense-foundations.pdf#page=21","pages":"21–22"}],"questions":[{"prompt":"ROC의 의미는?","options":["작전운용성능","수출 실적","생산 원가"],"correct":0,"explanation":"ROC는 군의 운용개념에 필요한 성능과 능력을 나타냅니다."},{"prompt":"OT에서 특히 확인하는 것은?","options":["광고 선호도","운용상의 적합성","주가 상승률"],"correct":1,"explanation":"운용시험평가는 실제 운용 관점의 적합성 등을 평가합니다."}]},{"id":"system-map","track":1,"title":"무기체계를 임무로 보기","subtitle":"탐지하고, 판단하고, 연결하고, 대응해요.","terms":["무기체계","전력지원체계","상호운용성"],"sections":[{"title":"장비 목록을 넘어","text":"무기체계는 전투력 발휘에 직접 관련되는 장비·물자뿐 아니라 관련 소프트웨어와 훈련체계 등도 포함합니다. 총과 미사일만을 뜻하지 않습니다."},{"title":"임무의 연결","text":"감시정찰은 정보를 얻고, 지휘통제는 상황을 판단하며, 통신은 정보를 전달합니다. 기동·화력·방공 등 체계가 이를 활용합니다. 이 연결은 이해를 위한 개념도이며 실제 운용 절차와는 구분해야 합니다."},{"title":"왜 상호운용성이 중요할까","text":"각 장비가 잘 작동해도 정보 형식과 인터페이스가 맞지 않으면 전체 체계의 효과가 떨어집니다. 플랫폼 성능과 체계 통합을 함께 보세요."}],"takeaway":"무기체계는 독립 장비가 아니라 임무를 위해 연결되는 시스템이다.","prompt":"무기체계에서 소프트웨어와 상호운용성이 중요한 이유는 무엇인가요?","guide":["정보 교환","인터페이스와 표준","전체 임무 효과"],"sources":[{"title":"무기체계 이해","url":"/materials/weapon-systems.pdf#page=8","pages":"8–24"}],"questions":[{"prompt":"무기체계에는 관련 소프트웨어가 포함될 수 있나요?","options":["아니요","예","수출품만 포함된다"],"correct":1,"explanation":"전투력 발휘에 영향을 주는 관련 소프트웨어도 포함될 수 있습니다."},{"prompt":"좋은 체계 통합의 조건은?","options":["개별 장비 성능만 높다","정보와 인터페이스가 서로 맞는다","모든 장비의 이름이 같다"],"correct":1,"explanation":"상호운용성은 체계 사이의 효과적인 정보 교환과 협업을 뒷받침합니다."}]},{"id":"c4isr","track":1,"title":"C4ISR, 연결의 가치","subtitle":"정보가 판단에 쓰이기까지.","terms":["C4ISR","C2","TICN"],"sections":[{"title":"약어를 풀면 역할이 보인다","text":"C4ISR은 지휘·통제·통신·컴퓨터·정보·감시·정찰을 묶는 개념입니다. 센서로 얻은 정보를 지휘관의 상황 인식과 의사결정에 활용하도록 연결합니다."},{"title":"통신과 지휘통제는 다르다","text":"통신은 정보의 전달 경로를 제공하고, 지휘통제체계는 정보를 처리·표시하여 지휘 판단을 지원합니다. TICN은 전술부대 사이의 정보 유통을 지원하는 전술정보통신체계입니다."},{"title":"한화시스템과의 접점","text":"센서와 지휘통제·통신을 함께 이해하면 방산전자의 역할이 선명해집니다. 지연, 신뢰성, 데이터 정합성과 보안을 시스템 관점에서 설명해 보세요."}],"takeaway":"C4ISR의 가치는 정보를 적시에 연결해 판단을 지원하는 데 있다.","prompt":"통신체계와 지휘통제체계의 차이를 설명해 주세요.","guide":["정보 전달 경로","정보 처리와 상황 인식","신뢰성·보안과 지연"],"sources":[{"title":"무기체계 이해","url":"/materials/weapon-systems.pdf#page=24","pages":"24–33"}],"questions":[{"prompt":"C4ISR의 핵심 가치는?","options":["무조건 가장 큰 장비","정보 연결과 의사결정 지원","통신 없이 개별 운용"],"correct":1,"explanation":"정보를 연결하고 상황 판단을 지원하는 통합 개념입니다."},{"prompt":"TICN은 어떤 역할에 가까운가요?","options":["전술 정보 통신","항공기 엔진","잠수함 선체"],"correct":0,"explanation":"TICN은 전술부대의 정보 유통을 지원합니다."}]},{"id":"sensors","track":1,"title":"레이더와 EO·IR","subtitle":"서로 다른 센서는 서로를 보완해요.","terms":["레이더","EO·IR","SAR"],"sections":[{"title":"레이더와 광학의 차이","text":"레이더는 전파를 이용해 표적 정보를 얻습니다. EO는 광학 영상, IR은 적외선 정보를 이용합니다. 관측 환경과 목적에 따라 장단점이 달라 센서 융합이 중요합니다."},{"title":"SAR는 관측 방식","text":"SAR(합성개구레이다)는 이동하는 레이더의 관측 정보를 처리해 영상을 만드는 기술입니다. 주야간 관측과 구름 등 기상 제약에 대한 강점이 있지만, 모든 환경에서 동일한 품질을 보장한다는 뜻은 아닙니다."},{"title":"관측위성과 통신위성","text":"관측위성은 지상을 보는 임무, 통신위성은 정보를 전달하는 임무가 중심입니다. 같은 우주 사업이라도 제공 가치가 다릅니다."}],"takeaway":"센서 이름보다 어떤 정보를 어떤 환경에서 얻는지 설명하자.","prompt":"SAR 위성과 광학 위성을 함께 활용하는 이유는 무엇인가요?","guide":["관측 방식의 차이","환경별 장단점","상호 보완과 분석"],"sources":[{"title":"무기체계 이해","url":"/materials/weapon-systems.pdf#page=35","pages":"35–44"},{"title":"한화시스템 · 우주·항공","url":"https://www.hanwhasystems.com/kr/business/defense/space.do"}],"questions":[{"prompt":"SAR의 역할에 가장 가까운 것은?","options":["레이더 영상 획득","항공기 연료 공급","수중 음파만 분석"],"correct":0,"explanation":"SAR는 전파 관측 정보를 처리해 영상을 생성합니다."},{"prompt":"관측위성과 통신위성의 차이는?","options":["전자는 관측, 후자는 정보 전달이 중심","둘 다 엔진을 만든다","차이가 없다"],"correct":0,"explanation":"대표 임무가 관측과 통신으로 구분됩니다."}]},{"id":"korean-platforms","track":1,"title":"K2·K9·천궁을 구분하기","subtitle":"기동, 화력, 방공은 임무가 달라요.","terms":["K2","K9","천궁","MFR"],"sections":[{"title":"K2와 K9","text":"K2는 전차로 기동과 직접 교전 임무를, K9는 자주포로 화력 지원 임무를 수행합니다. 외형에 궤도가 있다는 이유로 같은 장비로 분류하면 안 됩니다."},{"title":"천궁은 하나의 미사일만이 아니다","text":"천궁 계열 지대공 유도무기체계는 레이더, 지휘통제, 발사 장비, 유도탄 등이 결합된 방공체계입니다. 한화시스템의 대표 역할은 다기능레이다입니다."},{"title":"업체의 분업","text":"플랫폼 업체와 탑재장비 업체가 협력합니다. K2의 현대로템, K9의 한화에어로스페이스와 센서·전자장비를 제공하는 한화시스템을 구분하면 기업 질문에 더 정확히 답할 수 있습니다."}],"takeaway":"체계의 임무와 기업의 공급 범위를 함께 기억하자.","prompt":"한화시스템과 한화에어로스페이스의 사업 차이를 무기체계 예로 설명해 주세요.","guide":["K9 등 지상 체계","레이다·방산전자","한 체계 안에서의 협력"],"sources":[{"title":"무기체계 이해","url":"/materials/weapon-systems.pdf#page=19","pages":"19–20"},{"title":"한화에어로스페이스 · 지상 사업","url":"https://m.hanwhaaerospace.com/kor/whatwedo/product/land.do"},{"title":"현대로템 · K2","url":"https://www.hyundai-rotem.co.kr/ko/business/defense/details.do?productNm=K2+%EC%A0%84%EC%B0%A8"},{"title":"한화시스템 · 다기능레이다","url":"https://www.hanwhasystems.com/kr/business/defense/isr/radar01.do"}],"questions":[{"prompt":"K9의 분류는?","options":["전차","자주포","조기경보기"],"correct":1,"explanation":"K9은 화력 지원을 수행하는 자주포입니다."},{"prompt":"천궁 체계에서 한화시스템의 대표 공급 품목은?","options":["다기능레이다","전차 선체","수송기 동체"],"correct":0,"explanation":"한화시스템은 천궁 다기능레이다 사업을 수행합니다."}]},{"id":"aircraft","track":1,"title":"항공전력의 팀워크","subtitle":"전투기만으로 하늘의 임무를 완성할 수 없어요.","terms":["KF-21","FA-50","KC-330","E-737"],"sections":[{"title":"전투기와 훈련기","text":"FA-50은 T-50 계열에서 발전한 경전투기입니다. KF-21은 KAI가 개발을 주도하는 국산 전투기로, 한화시스템은 AESA 레이다 등 핵심 항공전자 장비에 참여합니다."},{"title":"지원 전력의 가치","text":"KC-330은 공중급유로 항공기의 임무 지속과 활동 범위를 지원합니다. E-737은 공중조기경보·통제로 공중 상황 인식과 지휘를 지원합니다. C-130J는 전술수송 임무에 사용됩니다."},{"title":"플랫폼과 항공전자","text":"기체를 만드는 회사와 레이더·시현기·임무컴퓨터를 만드는 회사는 다를 수 있습니다. 면접에서는 완성기와 탑재 장비의 역할을 정확히 나누세요."}],"takeaway":"항공전력은 전투·급유·수송·조기경보가 함께 만드는 능력이다.","prompt":"한화시스템은 KF-21에서 어떤 역할을 하나요?","guide":["KAI와 역할 구분","AESA·임무컴퓨터 등 항공전자","센서와 임무 처리의 가치"],"sources":[{"title":"공군무기체계 소개","url":"/materials/air-systems.pdf#page=14","pages":"14–21"},{"title":"한화시스템 · 항공전자","url":"https://www.hanwhasystems.com/kr/business/defense/space/avonics01.do"},{"title":"KAI · 사업 소개","url":"https://www.koreaaero.com/VIRTUAL_EX/CorporateZone/FixedWing.html"}],"questions":[{"prompt":"KC-330의 대표 역할은?","options":["공중급유","자주포 사격","수중 탐지"],"correct":0,"explanation":"공중급유는 항공전력의 임무 지속과 범위를 지원합니다."},{"prompt":"KF-21 사업에 대한 올바른 설명은?","options":["한화시스템이 모든 기체를 단독 제작한다","KAI의 기체 개발과 한화시스템의 항공전자 역할을 구분한다","한화시스템은 관련이 없다"],"correct":1,"explanation":"체계종합과 탑재장비 공급 역할을 구분하는 것이 핵심입니다."}]},{"id":"hanwha-overview","track":2,"title":"한화시스템을 한 문장으로","subtitle":"방산전자와 ICT라는 두 축.","terms":["방산전자","ICT","시스템 통합"],"sections":[{"title":"방산의 눈과 연결","text":"한화시스템의 방산 사업은 감시정찰 센서, 항공전자·우주, 지휘통제·통신 등 다양한 영역에 걸쳐 있습니다. 장비에서 얻은 정보를 활용 가능한 체계로 연결한다는 관점으로 이해해 보세요."},{"title":"ICT 사업도 함께 보기","text":"ICT 부문은 ERP, 스마트팩토리, 물류와 제조 데이터 등 기업의 디지털 전환을 지원합니다. 방산과 ICT를 모두 다루지만 모든 기술이나 매출이 자동으로 통합되는 것은 아닙니다."},{"title":"지원동기를 구체화","text":"“유망해서”에서 멈추지 말고 관심 사업 하나를 고르세요. 해결하는 고객 문제, 필요한 기술, 본인의 경험 순서로 연결하면 설득력이 생깁니다."}],"takeaway":"기업 소개를 외우기보다 사업의 고객과 해결 문제를 말하자.","prompt":"한화시스템에 관심을 갖게 된 사업과 본인의 기여 가능성을 설명해 주세요.","guide":["구체적인 사업 1개","해결하는 고객 문제","경험과 연결한 기여"],"sources":[{"title":"한화시스템 · 공식 사업 소개","url":"https://www.hanwhasystems.com/"},{"title":"한화시스템 · ICT 사업","url":"https://www.hanwhasystems.com/ict/kr/index.do"}],"questions":[{"prompt":"한화시스템의 사업을 설명한 것은?","options":["방산전자와 ICT","자주포만 생산","민간 여객기만 운영"],"correct":0,"explanation":"방산전자와 ICT 사업을 함께 이해해야 합니다."},{"prompt":"지원동기의 좋은 구성은?","options":["유명해서 지원했다","사업·고객 문제·나의 경험을 연결한다","사업 이름을 최대한 나열한다"],"correct":1,"explanation":"구체적인 사업과 자신의 역량을 연결해야 합니다."}]},{"id":"aesa","track":2,"title":"AESA, 전투기의 눈","subtitle":"레이다를 기술과 사업의 관점으로.","terms":["AESA","송수신 모듈","항공전자"],"sections":[{"title":"기술의 핵심","text":"AESA는 다수의 능동 송수신 소자를 이용해 전자적으로 빔을 제어하는 레이더입니다. 기계적으로 안테나 방향을 바꾸는 방식과 구분됩니다. 탐지·추적 등 여러 임무를 지원합니다."},{"title":"KF-21과의 연결","text":"한화시스템은 KF-21 AESA 레이다 사업을 수행합니다. 면접에서는 사거리 숫자를 외우는 것보다 센서, 신호처리, 소프트웨어와 항공기 연동의 중요성을 설명하는 편이 유용합니다."},{"title":"기술이 사업으로 확장되는 방식","text":"축적된 레이다 기술은 다른 플랫폼과 임무에도 응용될 수 있습니다. 다만 재사용 가능한 기술이 있다는 사실과 새로운 사업을 실제 수주했다는 사실은 다릅니다."}],"takeaway":"AESA의 가치는 센서 기술과 체계 연동 역량을 함께 볼 때 드러난다.","prompt":"KF-21 AESA 레이다 사업이 한화시스템에 중요한 이유는 무엇인가요?","guide":["핵심 항공전자 역량","신호처리·소프트웨어·연동","후속 사업 가능성과 실적 구분"],"sources":[{"title":"한화시스템 · KF-21 AESA 레이다","url":"https://www.hanwhasystems.com/kr/business/defense/isr/radar01-aesa.do"},{"title":"한화시스템 · 항공전자","url":"https://www.hanwhasystems.com/kr/business/defense/space/avonics01.do"}],"questions":[{"prompt":"AESA의 핵심 방식은?","options":["전자적 빔 제어","프로펠러로 전파 생성","광학 사진만 촬영"],"correct":0,"explanation":"능동 송수신 소자를 이용해 빔을 전자적으로 제어합니다."},{"prompt":"기술 재사용 가능성은 곧 신규 수주 확정인가요?","options":["예","아니요","항상 양산 완료를 의미한다"],"correct":1,"explanation":"기술 기반과 사업 수주·매출은 각각 구분해야 합니다."}]},{"id":"hanwha-space","track":2,"title":"우주 사업, 관측과 통신","subtitle":"SAR 탑재체와 위성통신망을 구분해요.","terms":["425사업","SAR 탑재체","저궤도 통신"],"sections":[{"title":"관측 분야의 역할","text":"한화시스템은 425 사업에서 SAR 탑재체를 공급했다고 발표했습니다. 위성 전체의 개발 주관, 탑재체 공급, 발사 서비스는 서로 다른 역할입니다."},{"title":"통신 분야의 방향","text":"회사는 2024년 상용 저궤도위성 기반 통신체계 사업 협약을 발표하며 2026년까지 통신망·이동형 단말 개발을 계획했습니다. 이는 발표 당시 계획이며 이 자료만으로 완료를 단정할 수 없습니다."},{"title":"미래 방향을 말하는 법","text":"2025년에는 초저궤도 고해상도 SAR 위성 목업과 AI 위성 데이터 분석 솔루션을 공개했습니다. “공개·개발 방향”과 “운용 중인 성능”을 구분해 설명하세요."}],"takeaway":"우주 사업은 관측·통신·데이터 활용의 역할과 단계로 이해하자.","prompt":"한화시스템의 우주 사업에서 주목하는 분야와 이유를 설명해 주세요.","guide":["SAR 관측 또는 위성통신 선택","현재 확인된 역할","발표된 계획과 완료 여부 구분"],"sources":[{"title":"425 사업 마지막 SAR 탑재체 공급 발표","url":"https://www.hanwhasystems.com/kr/prcenter/newsView.do?bbidx=730"},{"title":"2024년 저궤도 통신체계 사업 협약","url":"https://www.hanwhasystems.com/kr/prcenter/newsView.do?bbidx=600"}],"questions":[{"prompt":"SAR 탑재체 공급과 발사 서비스는?","options":["같은 역할이다","서로 다른 역할이다","둘 다 기체 조립만 의미한다"],"correct":1,"explanation":"탑재체 공급, 위성 체계 개발, 발사는 구분됩니다."},{"prompt":"“2026년까지 개발 계획”이라는 과거 발표를 읽을 때는?","options":["완료됐다고 확정한다","계획으로 표시하고 완료 여부는 별도 확인한다","매출 금액으로 바꿔 말한다"],"correct":1,"explanation":"계획 시점이 지났어도 완료를 확인한 자료가 있어야 합니다."}]},{"id":"hanwha-ict","track":2,"title":"ICT와 방산을 잇는 질문","subtitle":"데이터·소프트웨어 경험을 사업 언어로.","terms":["ERP","MES","데이터","MRO"],"sections":[{"title":"기업 운영의 디지털화","text":"ERP는 기업 자원의 통합 관리, MES는 제조 현장의 실행 관리를 지원합니다. 한화시스템 ICT는 스마트팩토리와 물류, 제조 데이터 활용 등을 제공합니다."},{"title":"운영 데이터를 가치로","text":"데이터가 모이는 것만으로 개선이 끝나지 않습니다. 정확성, 연결성, 권한과 현장 프로세스를 함께 다뤄야 합니다. 정비·운영의 데이터를 활용하는 MRO 솔루션도 관련 영역입니다."},{"title":"경험을 설명하는 구조","text":"본인의 프로젝트에서 어떤 문제가 있었고 어떤 데이터를 어떻게 검증했는지, 그 결과가 누구의 업무에 도움이 됐는지 말해 보세요. 방산 경험이 없더라도 검증 가능한 역량을 연결할 수 있습니다."}],"takeaway":"기술 이름보다 현장의 문제와 검증된 개선 결과를 설명하자.","prompt":"본인의 소프트웨어·데이터 경험을 한화시스템 사업에 어떻게 연결할 수 있나요?","guide":["현장의 문제 정의","구현과 검증 과정","측정한 결과와 한계"],"sources":[{"title":"한화시스템 · ICT 사업","url":"https://www.hanwhasystems.com/ict/kr/index.do"}],"questions":[{"prompt":"MES가 주로 지원하는 것은?","options":["제조 실행 관리","위성 발사","전차 장갑 설계"],"correct":0,"explanation":"MES는 제조 현장의 실행과 데이터를 관리하는 체계입니다."},{"prompt":"경험을 설득력 있게 설명하려면?","options":["기술명만 나열","문제·행동·검증 결과 제시","모든 성과를 혼자 했다고 표현"],"correct":1,"explanation":"자신이 한 일과 확인된 결과를 구체적으로 제시하세요."}]},{"id":"hanwha-future","track":2,"title":"미래 사업을 읽는 기준","subtitle":"성장 방향, 실행 과제, 나의 관점.","terms":["센서 융합","AI","다계층 통신","PBL"],"sections":[{"title":"공개 자료에서 읽히는 방향","text":"회사의 우주·센서·ICT 소개와 발표를 함께 보면 센서 고도화, 위성 데이터 활용, 지상망과 위성망 연결을 성장 방향으로 읽을 수 있습니다. 이것은 자료에 기반한 학습용 해석이며 수주·실적 전망은 아닙니다."},{"title":"사업에는 실행 과제가 있다","text":"기술 시연 뒤에는 검증, 양산, 비용, 연동, 운용 지원이 남습니다. PBL은 가용성 등 합의한 성과를 중심으로 군수지원을 수행하는 방식입니다. 레이다 사업도 납품 후 지원까지 이어질 수 있습니다."},{"title":"기회와 과제를 함께 말하기","text":"“AI가 중요하다”보다 “관측 데이터를 신뢰할 수 있는 정보로 만드는 과정에서 데이터 품질과 검증이 중요하다”처럼 말해 보세요. 장점과 실행 과제를 함께 제시하면 균형이 생깁니다."}],"takeaway":"미래 방향은 기대만이 아니라 검증·양산·운용 과제와 함께 설명한다.","prompt":"한화시스템의 미래 사업 중 관심 분야와 해결해야 할 과제는 무엇인가요?","guide":["공식 발표 근거","기회와 실행 과제","지원 직무에서 가능한 기여"],"sources":[{"title":"한화시스템 · 우주·항공","url":"https://www.hanwhasystems.com/kr/business/defense/space.do"},{"title":"한화시스템 · ICT 사업","url":"https://www.hanwhasystems.com/ict/kr/index.do"},{"title":"한화시스템 · 천궁 다기능레이다 PBL 계약 발표","url":"https://www.hanwhasystems.com/kr/prcenter/newsView.do?bbidx=432"}],"questions":[{"prompt":"PBL은 무엇을 중심으로 하나요?","options":["합의한 군수지원 성과","회사 광고 횟수","주가 목표"],"correct":0,"explanation":"PBL은 성과기반 군수지원입니다."},{"prompt":"미래 사업을 말할 때 좋은 태도는?","options":["성공을 단정","기회와 실행 과제를 함께 설명","과거 계획을 현재 실적으로 표현"],"correct":1,"explanation":"근거와 단계, 남은 과제를 구분해 설명하세요."}]},{"id":"domestic","track":3,"title":"국내 기업, 역할로 기억하기","subtitle":"경쟁사이면서 협력사인 방산 생태계.","terms":["체계종합","탑재장비","공급망"],"sections":[{"title":"대표 분야를 연결","text":"한화에어로스페이스는 K9·천무 등 지상 체계와 항공·우주 분야, KAI는 KF-21·FA-50 등 항공기, 현대로템은 K2 등 지상 기동 체계가 대표적입니다."},{"title":"한화시스템의 위치","text":"한화시스템은 레이다·전자광학·항공전자·통신·지휘통제 등 방산전자 분야에서 다양한 플랫폼과 연결됩니다. 한 체계 안에서도 업체별 역할이 나뉩니다."},{"title":"경쟁과 협력의 공존","text":"어떤 사업에서는 경쟁하고 다른 사업에서는 공동으로 참여할 수 있습니다. 회사를 하나의 장비로만 단정하지 말고, 해당 사업의 주관업체와 구성품 공급 범위를 확인하세요."}],"takeaway":"기업 비교는 순위보다 해당 체계에서 맡는 역할로 시작한다.","prompt":"국내 방산 기업의 협력 구조를 KF-21 또는 천궁 사례로 설명해 주세요.","guide":["체계종합과 탑재장비","회사별 역할","연동과 품질 책임"],"sources":[{"title":"한화에어로스페이스 · 지상 사업","url":"https://m.hanwhaaerospace.com/kor/whatwedo/product/land.do"},{"title":"한화시스템 · 항공전자","url":"https://www.hanwhasystems.com/kr/business/defense/space/avonics01.do"},{"title":"KAI · 항공기 소개","url":"https://www.koreaaero.com/VIRTUAL_EX/CorporateZone/FixedWing.html"}],"questions":[{"prompt":"K2의 대표 체계 업체는?","options":["현대로템","KAI","한화시스템 단독"],"correct":0,"explanation":"K2 전차는 현대로템의 대표 지상 체계입니다."},{"prompt":"기업 비교 시 우선 확인할 것은?","options":["로고 색상","해당 사업의 역할과 공급 범위","무조건 매출 순위만"],"correct":1,"explanation":"같은 체계에 서로 다른 역할로 참여할 수 있습니다."}]},{"id":"global","track":3,"title":"글로벌 기업 지도","subtitle":"미국과 유럽 기업을 대표 역량으로.","terms":["Lockheed Martin","RTX","BAE Systems","Thales"],"sections":[{"title":"플랫폼과 통합체계","text":"Lockheed Martin은 F-35와 Aegis 등으로, Northrop Grumman은 B-21 등 항공·임무체계 분야로 살펴볼 수 있습니다. 대표 제품은 학습의 출발점이며 전체 사업을 의미하지 않습니다."},{"title":"센서·전자 분야 비교","text":"RTX의 Raytheon은 Patriot와 LTAMDS, BAE Systems는 전자전, Thales는 Ground Fire 등 레이다 분야의 사례를 제공합니다. 한화시스템과 비교할 때는 같은 센서·통합 기능을 골라 보세요."},{"title":"규모보다 비교 축","text":"탐지·정보처리·연동·유지보수·수출 지원 같은 축을 정하면 비교가 명확해집니다. 공개 자료만으로 확인할 수 없는 성능 우열은 단정하지 않습니다."}],"takeaway":"글로벌 비교는 같은 기능과 고객 문제를 기준으로 하자.","prompt":"한화시스템과 비교해 보고 싶은 글로벌 기업과 비교 기준은 무엇인가요?","guide":["기업과 제품 선택","동일 기능으로 비교","공개 근거와 한계"],"sources":[{"title":"Lockheed Martin · Aegis","url":"https://www.lockheedmartin.com/aegis"},{"title":"Raytheon · LTAMDS","url":"https://www.rtx.com/raytheon/what-we-do/integrated-air-and-missile-defense/ltamds"},{"title":"BAE Systems · 전자전","url":"https://www.baesystems.com/en-us/product/electronic-warfare"},{"title":"Thales · Ground Fire","url":"https://www.thalesgroup.com/en/solutions-catalogue/defence/air/ground-fire"}],"questions":[{"prompt":"Raytheon의 대표 방공체계는?","options":["Patriot","K2","K9"],"correct":0,"explanation":"Patriot는 Raytheon의 대표 방공체계입니다."},{"prompt":"비교 방법으로 적절한 것은?","options":["공개 근거 없이 우열 확정","동일 기능과 고객 문제 중심","국적만으로 기술력 결정"],"correct":1,"explanation":"같은 기능과 검증 가능한 정보를 기준으로 비교하세요."}]},{"id":"exports","track":3,"title":"방산수출은 패키지다","subtitle":"가격·성능 밖의 경쟁력을 읽어요.","terms":["현지화","후속지원","납기","G2G"],"sections":[{"title":"성능만으로 결정되지 않는다","text":"구매국의 임무와 지형, 예산, 필요한 시기와 현지 산업 정책이 함께 작용합니다. 납기와 생산 역량, 교육·정비·부품 지원도 경쟁력입니다."},{"title":"현지화와 장기 관계","text":"기술 협력·현지 생산·산업 협력은 구매국 요구에 맞추어 검토됩니다. 정부 간 협력과 금융 조건도 사업 추진에 영향을 줄 수 있습니다. 구체적인 허가·계약 조건은 사업마다 다릅니다."},{"title":"사례를 설명하는 방법","text":"첨부 자료의 성공·실패 사례는 강의 시점의 설명입니다. 면접에서는 특정 국가에 대한 단정 대신 요구조건, 납기, 금융, 지원체계 중 어떤 요인이 중요했는지 정리하세요."}],"takeaway":"방산수출은 장비와 함께 장기간 운용할 수 있는 조건을 제공하는 일이다.","prompt":"한국 방산의 수출 경쟁력을 성능·가격 외의 요인으로 설명해 주세요.","guide":["납기와 생산 능력","현지화와 후속지원","구매국의 요구 이해"],"sources":[{"title":"수출 사례와 미래 방산","url":"/materials/export-future.pdf#page=4","pages":"4–21"},{"title":"한화에어로스페이스 · 천무 2차 실행계약","url":"https://m.hanwhaaerospace.com/kor/media/newsroom/view.do?seq=399"}],"questions":[{"prompt":"수출 경쟁력에 포함되는 것은?","options":["납기·교육·정비 지원","성능만","광고 문구만"],"correct":0,"explanation":"구매국이 안정적으로 운용할 수 있는 전체 조건이 중요합니다."},{"prompt":"현지화는 주로 무엇과 연결되나요?","options":["구매국의 산업·생산 협력 요구","모든 기술의 무조건 공개","계약 없는 양산"],"correct":0,"explanation":"현지 생산과 산업 협력은 구매국 요구와 계약에 따라 검토됩니다."}]},{"id":"news-literacy","track":3,"title":"방산 뉴스를 정확히 읽기","subtitle":"MOU, 기본계약, 실행계약, 매출.","terms":["MOU","실행계약","수주","매출"],"sections":[{"title":"기사의 동사부터 보기","text":"협의했다, 협약했다, 계약했다, 납품했다는 서로 다른 단계입니다. MOU는 협력 의사를 담는 경우가 많고 구속력은 내용에 따라 달라집니다. 이를 확정 매출로 읽으면 안 됩니다."},{"title":"계약과 매출도 다르다","text":"계약을 체결했다고 그 금액이 즉시 전부 매출로 인식되는 것은 아닙니다. learn(s){return head('YOUR LEARNING PATH','큰 그림부터, 깊이 있는 이해까지.','20개 학습 · 40개 확인 문제 · 오늘은 하나만 해도 충분해요.')+`<div class="progress-overview"><b>${s.done.size} / 20 완료</b><span>${s.xp} XP</span></div><div class="filters">${button('전체','track',-1,filter===-1?'selected':'')}${tracks.map((t,i)=>button(esc(t.name),'track',i,filter===i?'selected':'')).join('')}</div>${tracks.map((t,i)=>filter!==-1&&filter!==i?'':`<section class="lesson-group"><h2>${esc(t.name)}</h2><div class="lesson-list">${lessons.filter(l=>l.track===i).map(l=>`<button class="lesson-row" data-action="lesson" data-value="${l.id}"><span class="lesson-index ${s.done.has(l.id)?'complete':''}">${s.done.has(l.id)?'✓':String(lessons.indexOf(l)+1).padStart(2,'0')}</span><div><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p></div><span class="lesson-meta">10분 · 2문제</span></button>`).join('')}</div></section>`).join('')}`;},
companies(){return head('INDUSTRY INTELLIGENCE','회사를 알면, 사업이 연결됩니다.','대표 사업과 역할을 비교하고, 한화시스템의 위치를 찾아보세요.')+`<section class="company-spotlight"><div><p class="overline">FOCUS COMPANY</p><h2>한화시스템</h2><p>센서에서 정보로.<br>정보에서 연결된 시스템으로.</p>${button('한화시스템 집중 학습','track',2)}</div><div><h3>감시·정찰 · 우주·항공 · ICT</h3><p>AESA, 전자광학, 항공전자, 위성 탑재체와 기업 ICT</p></div></section><div class="filters">${['전체','국내','글로벌'].map(r=>button(r,'region',r,region===r?'selected':'')).join('')}</div><div class="course-grid">${companies.filter(c=>region==='전체'||c.region===region).map(c=>`<article class="course-card"><span class="overline">${esc(c.field)}</span><h3>${esc(c.name)}</h3><p>${esc(c.products)}</p><p><strong>면접 포인트</strong><br>${esc(c.point)}</p>${source([c.source])}</article>`).join('')}</div>`;},
review(s){const r=s.due[0];let body='';if(reviewResult){body=`<section class="habit-card"><h2>${reviewResult.correct?'정확해요.':'다시 기억해 두세요.'}</h2><p>${esc(reviewResult.explanation)}</p>${button('다음 복습','review-next')}</section>`;}else if(r){const [id,i]=r.question_id.split(':'),q=lessons.find(l=>l.id===id).questions[Number(i)];body=`<section class="habit-card"><h2>${esc(q.prompt)}</h2><div class="options">${q.options.map((o,i)=>button(esc(o),'review-answer',i,'')).join('')}</div></section>`;}else body=`<section class="habit-card"><h2>오늘의 복습을 모두 마쳤어요.</h2><p>학습 중 틀린 문제는 내일부터 이곳에 나타납니다.</p>${button('학습 코스 보기','nav','learn')}</section>`;return head('SPACED REPETITION','다시 떠올릴수록, 더 오래.','오답은 1일 뒤, 정답 복습은 3·7·14·30일 간격으로 돌아옵니다.')+body+`<section class="lesson-group"><h2>복습 일정</h2><div class="lesson-list">${data.reviews.map(r=>{const [id,i]=r.question_id.split(':');return `<div class="schedule-row"><b>${esc(lessons.find(l=>l.id===id)?.questions[Number(i)]?.prompt)}</b><span>${r.due<=s.today?'오늘':r.due}</span></div>`;}).join('')||'<p>아직 등록된 오답이 없습니다.</p>'}</div></section>`;},
interview(){const l=lessons.find(l=>l.id===noteId);return head('MAKE IT YOUR ANSWER','나의 언어로, 60초.','학습한 내용을 나의 경험과 연결해 보세요. 학습용 예상 질문입니다.')+`<div class="notebook"><aside><label for="question">연습할 질문</label><select id="question">${lessons.map(l=>`<option value="${l.id}" ${l.id===noteId?'selected':''}>${esc(l.title)}${data.notes.some(n=>n.lesson_id===l.id&&n.body)?' · 작성됨':''}</option>`).join('')}</select><h3>답변에 담을 세 가지</h3>${l.guide.map(g=>`<label class="check-item"><input type="checkbox"><span>${esc(g)}</span></label>`).join('')}<div class="timer"><span class="overline">말하기 연습</span><b id="timer-value">${timeText()}</b><div>${button('시작 / 일시정지','timer','','secondary')}${button('초기화','timer-reset','','secondary')}</div><p id="timer-status" role="status"></p></div><small>녹음이나 자동 AI 평가 없이 직접 점검합니다.</small></aside><section class="answer-editor"><h2>${esc(l.prompt)}</h2><label for="answer" class="sr-only">나의 면접 답변</label><textarea id="answer" maxlength="6000" placeholder="제 생각은…&#10;그 이유는…&#10;저는 … 경험으로 기여할 수 있습니다.">${esc(draft)}</textarea><div class="editor-bottom"><span id="count">${draft.length} / 6,000자</span>${button('답변 저장','note-save')}</div><p id="save-status" role="status"></p>${button('관련 개념 다시 보기','lesson',l.id,'text-button')}${source(l.sources)}</section></div>`;},
library(){return head('YOUR KNOWLEDGE LIBRARY','모든 배움의 출발점.','첨부 강의 자료 7개와 학습 기록을 관리하세요.')+`<div class="library-note"><p>PDF를 열려면 HTML 옆에 materials 폴더를 두세요. 외부 공식 자료는 인터넷이 필요합니다.</p></div><div class="documents">${documents.map(d=>`<article><div class="doc-icon">PDF</div><div><h2>${esc(d.title)}</h2><p>${esc(d.desc)}</p><small>${esc(d.original)} · ${d.pages}쪽</small></div><a class="secondary" href="./materials/${esc(d.file)}" target="_blank" rel="noopener">원문 열기 ↗</a></article>`).join('')}</div><section class="habit-card"><h2>학습 기록 백업</h2><p>같은 브라우저와 파일 위치를 유지하세요. 브라우저 데이터를 지우면 기록도 삭제될 수 있습니다.</p>${button('기록 백업 다운로드','backup','','secondary')} <label class="secondary" for="restore">백업 파일 가져오기</label><input type="file" id="restore" accept="application/json,.json" hidden><p id="backup-status" role="status"></p><a href="https://hanwha-interview-daily.hwangjiwon834.chatgpt.site" target="_blank" rel="noopener">기존 웹사이트 열기 ↗</a></section>`;}
};
function stopTimer(){clearInterval(timer);timer=null;}
function timeText(){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
function dirty(){return draft!==(data.notes.find(n=>n.lesson_id===noteId)?.body||'');}
function go(value){if(tab==='interview')stopTimer();tab=value;render();window.scrollTo(0,0);$('main').focus();}
function modal(){const l=lessons.find(l=>l.id===quiz.id),q=l.questions[quiz.step];let html='';
if(quiz.step<0)html=`<p class="eyebrow">오늘의 핵심 개념</p><h1 id="lesson-title">${esc(l.title)}</h1><p class="lead">${esc(l.subtitle)}</p><div class="term-chips">${l.terms.map(t=>`<span>${esc(t)}</span>`).join('')}</div>${l.sections.map((s,i)=>`<section class="reading-section"><span>0${i+1}</span><div><h2>${esc(s.title)}</h2><p>${esc(s.text)}</p></div></section>`).join('')}<div class="takeaway"><p>${esc(l.takeaway)}</p></div>${source(l.sources)}${button('개념 확인 문제 풀기 · 2문제','quiz-start','','primary wide')}`;
else if(quiz.saved)html=`<div class="completion"><p class="eyebrow">ONE STEP FORWARD</p><h1 id="lesson-title">오늘도, 한 걸음 더.</h1><div class="completion-stats"><div><b>${quiz.score}/2</b><span>정답</span></div><div><b>${20+quiz.score*10}</b><span>이번 학습 XP</span></div></div><p>같은 날 같은 학습은 최고 점수만 반영합니다.<br>틀린 문제는 내일 복습에 나타납니다.</p>${button('면접 답변 연습하기','note-open',l.id,'primary wide')}${button('오늘의 학습으로 돌아가기','close','','text-button')}</div>`;
else html=`<p class="eyebrow">CHECK YOUR UNDERSTANDING · ${quiz.step+1} / 2</p><h1 id="lesson-title" class="question-title">${esc(q.prompt)}</h1><div class="options">${q.options.map((o,i)=>`<button data-action="choice" data-value="${i}" ${quiz.revealed?'disabled':''} class="${quiz.choice===i?'chosen':''} ${quiz.revealed&&q.correct===i?'correct':''} ${quiz.revealed&&quiz.choice===i&&q.correct!==i?'incorrect':''}"><span>${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')}</div>${quiz.revealed?`<div class="feedback" role="status"><b>${quiz.choice===q.correct?'정확해요.':'여기서 기억해 두세요.'}</b><p>${esc(q.explanation)}</p></div>${button(quiz.step===1?'학습 완료하고 기록하기':'다음 문제','quiz-next','','primary wide')}`:`<button class="primary wide" data-action="reveal" ${quiz.choice===null?'disabled':''}>정답 확인</button>`}`;
const dlg=$('#lesson');dlg.innerHTML=`<div class="dialog-header"><span>LESSON ${String(lessons.indexOf(l)+1).padStart(2,'0')}</span><button class="icon-button" aria-label="학습 닫기" data-action="close">✕</button></div><div class="dialog-content">${html}</div>`;if(!dlg.open){dlg.showModal();document.body.style.overflow='hidden';}$('.dialog-content').scrollTop=0;}
function close(){ $('#lesson').close();document.body.style.overflow='';quiz=null;}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();const a=b.dataset.action,v=b.dataset.value;
if(a==='nav')go(v);
if(a==='track'){filter=Number(v);go('learn');}
if(a==='region'){region=v;render();}
if(a==='pipe'){pipe=Number(v);render();}
if(a==='lesson'){quiz={id:v,step:-1,answers:[],choice:null,revealed:false};modal();}
if(a==='close')close();
if(a==='quiz-start'){quiz.step=0;modal();}
if(a==='choice'){quiz.choice=Number(v);modal();}
if(a==='reveal'&&quiz.choice!==null){quiz.revealed=true;modal();}
if(a==='quiz-next'){quiz.answers[quiz.step]=quiz.choice;if(quiz.step===0){quiz.step++;quiz.choice=null;quiz.revealed=false;modal();}else{const l=lessons.find(l=>l.id===quiz.id),next=structuredClone(data),today=day(),score=l.questions.reduce((n,q,i)=>n+Number(q.correct===quiz.answers[i]),0),old=next.attempts.find(x=>x.lesson_id===l.id&&x.day===today);if(!old)next.attempts.push({lesson_id:l.id,day:today,score,answers:JSON.stringify(quiz.answers)});else if(score>=old.score){old.score=score;old.answers=JSON.stringify(quiz.answers);}l.questions.forEach((q,i)=>{if(q.correct!==quiz.answers[i]){const id=l.id+':'+i,r=next.reviews.find(r=>r.question_id===id),value={question_id:id,due:add(today,1),stage:0};if(r)Object.assign(r,value);else next.reviews.push(value);}});if(persist(next)){quiz.saved=true;quiz.score=score;render();modal();}}}
if(a==='note-open'){if(dirty()&&!confirm('저장하지 않은 답변을 두고 다른 질문으로 이동할까요?'))return;close();noteId=v;draft=data.notes.find(n=>n.lesson_id===v)?.body||'';seconds=60;go('interview');}
if(a==='note-save'){const next=structuredClone(data),n=next.notes.find(n=>n.lesson_id===noteId),value={lesson_id:noteId,body:draft,updated_at:new Date().toISOString()};if(n)Object.assign(n,value);else next.notes.push(value);if(persist(next))$('#save-status').textContent='답변을 저장했습니다.';}
if(a==='timer'){if(timer)stopTimer();else{if(!seconds)seconds=60;timer=setInterval(()=>{seconds--;$('#timer-value').textContent=timeText();if(seconds<=0){stopTimer();$('#timer-status').textContent='60초가 지났어요. 핵심을 충분히 전했나요?';}},1000);}}
if(a==='timer-reset'){stopTimer();seconds=60;$('#timer-value').textContent=timeText();$('#timer-status').textContent='';}
if(a==='review-answer'){const r=stats().due[0];if(!r)return;const [id,i]=r.question_id.split(':'),q=lessons.find(l=>l.id===id).questions[Number(i)],correct=q.correct===Number(v),next=structuredClone(data),nr=next.reviews.find(x=>x.question_id===r.question_id);nr.stage=correct?Math.min(nr.stage+1,4):0;nr.due=add(day(),[1,3,7,14,30][nr.stage]);if(!next.activity.some(x=>x.day===day()))next.activity.push({day:day()});if(persist(next)){reviewResult={correct,explanation:q.explanation};render();}}
if(a==='review-next'){reviewResult=null;render();}
if(a==='backup')download(JSON.stringify({format:'defense-daily-v1',data},null,2),'Defense-Daily-기록-'+day()+'.json','application/json');
if(a==='reminder'){const date=add(day(),1).replaceAll('-',''),stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';download(['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Defense Daily//KO','BEGIN:VEVENT','UID:defense-daily-'+stamp+'@study','DTSTAMP:'+stamp,'DTSTART:'+date+'T120000Z','DTEND:'+date+'T121000Z','RRULE:FREQ=DAILY','SUMMARY:Defense Daily 하루 10분','DESCRIPTION:Defense-Daily.html을 열고 오늘의 학습을 시작하세요.','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:하루 10분 학습할 시간입니다.','END:VALARM','END:VEVENT','END:VCALENDAR',''].join('\r\n'),'defense-daily.ics','text/calendar;charset=utf-8');}
});
document.addEventListener('input',e=>{if(e.target.id==='answer'){draft=e.target.value;$('#count').textContent=draft.length+' / 6,000자 · 저장 전';$('#save-status').textContent='';}});
document.addEventListener('change',async e=>{if(e.target.id==='question'){if(dirty()&&!confirm('저장하지 않은 답변을 두고 다른 질문으로 이동할까요?')){e.target.value=noteId;return;}stopTimer();noteId=e.target.value;draft=data.notes.find(n=>n.lesson_id===noteId)?.body||'';seconds=60;render();}if(e.target.id==='restore'){const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('파일이 너무 큽니다.');const parsed=JSON.parse(await file.text()),p=parsed.data,validId=id=>lessons.some(l=>l.id===id),date=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);if(parsed.format!=='defense-daily-v1'||!p||!['attempts','reviews','notes','activity'].every(k=>Array.isArray(p[k]))||p.attempts.some(a=>!validId(a.lesson_id)||!date(a.day)||!Number.isInteger(a.score)||a.score<0||a.score>2)||p.notes.some(n=>!validId(n.lesson_id)||typeof n.body!=='string'||n.body.length>6000)||p.reviews.some(r=>!lessons.some(l=>[l.id+':0',l.id+':1'].includes(r.question_id))||!date(r.due)||!Number.isInteger(r.stage)||r.stage<0||r.stage>4)||p.activity.some(a=>!date(a.day)))throw Error('올바른 학습 백업 파일이 아닙니다.');if(!confirm('현재 브라우저의 기록을 이 백업으로 바꿀까요?'))return;if(persist(p)){draft=data.notes.find(n=>n.lesson_id===noteId)?.body||'';render();$('#backup-status').textContent='백업을 복원했습니다.';}}catch(err){alert('가져오기 실패: '+err.message);}}});
$('#lesson').addEventListener('cancel',e=>{e.preventDefault();close();});
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
render();
})();
</script></body></html>
